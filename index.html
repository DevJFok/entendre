<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entendre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game">
  <header class="top">
    <div class="score" id="aScore" aria-label="Base points">+ 0</div>
    <div class="timer" id="timer" aria-live="off">2:00</div>
    <div class="score mult" id="mult" aria-label="Multiplier">x 1</div>
  </header>
  <section class="cats">
    <div class="cat catA" id="catA">&hellip;</div>
    <div class="cat catB" id="catB">&hellip;</div>
  </section>
  <div class="entendre" id="entendre">Entendre x1</div>
  <div class="start" id="start">
    <button type="button" id="playToday" class="btn yellow">Play today</button>
    <button type="button" id="playArchive" class="btn green">Play archive</button>
  </div>
  <h1 class="heading">List Words</h1>
  <ul class="words" id="words" aria-live="polite"></ul>
  <div class="msg" id="msg" role="status"></div>
  <form class="entry" id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Type here" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Type a word">
    <button type="submit" id="enter">Enter</button>
  </form>
  <button type="button" id="reopen" class="reopen" hidden>Results</button>
</main>
<div class="overlay" id="end" hidden>
  <div class="card">
    <button type="button" class="close" id="closeEnd" aria-label="Close">&times;</button>
    <h2>Time's up!</h2>
    <div class="final" id="finalTotal">0</div>
    <div class="label">final score</div>
    <ul class="break" id="breakdown"></ul>
    <button type="button" id="share" class="btn yellow">Share results</button>
    <button type="button" id="endless" class="btn red">Play endless</button>
    <button type="button" id="archive" class="btn green">Play archive</button>
  </div>
</div>
<section id="archivePage" hidden>
  <header class="archive-head">
    <h2>Archive</h2>
    <button type="button" class="archive-close" id="closeArchive" aria-label="Back to results">&times;</button>
  </header>
  <ul class="archive-list" id="archiveList"></ul>
</section>
<script src="scoring.js"></script>
<script src="words.js"></script>
<script src="puzzles.js"></script>
<script src="remote.js"></script>
  <script src="review-queue.js"></script>
  <script src="app.js"></script>
<script src="share.js"></script>
</body>
</html>
